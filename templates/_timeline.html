<ol class="timeline">
  {% for e in items %}
  <li class="tl-item{% if e.current %} is-current{% endif %}">
    <div class="tl-head">
      <h3 class="tl-title">{{ e.title }}</h3>
      {% if e.years %}<span class="tl-years">{{ e.years }}</span>{% elif e.current %}<span class="tl-years">{{ tx.now }}</span>{% endif %}
    </div>
    <p class="tl-place">{{ e.place }}</p>
    {% if e.detail %}<p class="tl-detail">{{ e.detail }}</p>{% endif %}
  </li>
  {% endfor %}
</ol>
